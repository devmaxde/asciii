[package]
name = "asciii"
version = "3.10.0"
authors = ["Hendrik Sollich <hendrik@hoodie.de>"]
license = "MIT/Apache-2.0"
readme = "README.md"
description = """The advanced but simple commandline interface for invoice invocation.
This is an internal tool of the Studentencafe ascii in Dresden and therefore specialized for our use cases."""
homepage = "https://github.com/ascii-dresden/asciii/"
repository = "https://github.com/ascii-dresden/asciii/"
documentation = "https://docs.rs/asciii/"
edition = "2021"

build = true
autobins = false

include = [
    "Cargo.toml",
    ".gitignore",
    ".travis.yml",
    "./Cargo.toml",
    "./History.md",
    "./README.md",
    "build.rs",
    "lang/*",
    "src/default_config.yml",
    "src/**/*.rs",
    "src/zugferd/*.icc",
    "src/zugferd/*.md",
    "tests/**/*.rs",
]
exclude = ["*.pdf", "pkg"]

[features]
default = [
    "cli",
    "document_export",
    "git_statuses",
    "serialization",
    "deserialization",
    "shell",
    "localize",
    "zugferd",
    "tui",
]
travis_compatible = [
    "cli",
    "document_export",
    "git_statuses",
    "serialization",
    "deserialization",
    "shell",
    "meta",
    "version_string",
    "par_open",
]
mini_tool = ["cli", "document_export"]
full_tool = ["travis_compatible", "localize"]
document_export = ["handlebars", "serialization"]
zugferd = ["document_export", "lopdf"]
serde_base = ["serde", "serde_derive"]
serialization = ["serde_base", "serde_json"]
deserialization = ["serde_base", "serde_yaml", "ordered-float", "num-traits"]
meta = ["serialization", "deserialization"]
git_statuses = ["git2"]
shell = ["rustyline"]
version_string = []
localize = []
cli = []
nightly = []
par_open = ["rayon"]
tui = ["ratatui", "libc", "crossterm"]
manual = []


[dependencies]
log = "0.4"
env_logger = "0.11"
yaml-rust = "0.4"
chrono = "0.4"
regex = "1.13"
lazy_static = "1.5"
maplit = "1.0"
clap = { version = "4", features = ["cargo"] }
clap_complete = "4"
enum_derive = "0.1"
custom_derive = "0.1"
open = "5"
crowbook-intl-runtime = "0.1"
rayon = { version = "1.12", optional = true }
rustyline = { version = "19", optional = true, features = ["derive"] }
linked-hash-map = { version = "0.5", features = ["serde_impl"] }
dirs = "7"
term = "1.0"
thiserror = "2.0"
anyhow = "1.0"


bill = { version = "0.4", features = ["serialization"] }
icalendar = "0.17"

slug = "0.1"
tempdir = "0.3"
semver = "1.0"
term_size = "0.3"

prettytable-rs = { default-features = false, version = "0.10" }

# feature: document_export
handlebars = { version = "6", optional = true }

serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
serde_derive = { version = "1.0", optional = true }
ordered-float = { version = "5", optional = true }
num-traits = { version = "0.2", optional = true }
toml = "1.0"

# feature: git_statuses
git2 = { version = "0.21", default-features = false, optional = true }
color-backtrace = "0.7"

# feature: zugferd (e-invoice XML embedded into the invoice PDF)
lopdf = { version = "0.47", default-features = false, optional = true }

# feature: tui
ratatui = { version = "0.30", optional = true }
libc = { version = "0.2", optional = true }
# same crossterm as ratatui; `use-dev-tty` polls the terminal instead of registering it with kqueue (macOS),
# so handing stdin to pdflatex and back does not break keyboard input
crossterm = { version = "0.29", optional = true, features = ["use-dev-tty"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true
codegen-units = 1
panic = 'abort'

[[bin]]
test = false
doc = false
name = "asciii"
required-features = ["cli"]


[build-dependencies]
chrono = "0.4"
crowbook-intl = "0.2"
